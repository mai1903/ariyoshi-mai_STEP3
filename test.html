<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>世界一甘いお店</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>

  <div class="header">
    <h2>世界一甘いお店</h2>
  </div>

  <div class="sidebar">
    <ul>
      <li><a href="#">トップ</a></li>
      <li><a href="#">新着情報</a></li>
      <li><a href="#">おすすめのスイーツ</a></li>
      <li><a href="#">お問い合わせ</a></li>
    </ul>
  </div>

  <div class="main">
    <form>
      <!-- 枠線4px、セルも囲まれる -->
      <table border="4" cellpadding="5" cellspacing="0">
        <tr>
          <td>お名前</td>
          <td><input type="text" size="40"></td>
        </tr>
        <tr>
          <td>お近くのお店</td>
          <td>
            <select>
              <option>北海道・東北</option>
              <option>関東</option>
              <option>中部</option>
              <option>関西</option>
              <option>中国・四国</option>
              <option>九州・沖縄</option>
            </select>
          </td>
        </tr>
        <tr>
          <td>電話</td>
          <td><input type="text" size="40"></td>
        </tr>
        <tr>
          <td>電話番号</td>
          <td><input type="text" size="40"></td>
        </tr>
        <tr>
          <td>メールアドレス</td>
          <td><input type="text" size="40"></td>
        </tr>
        <tr>
          <td>お問い合わせ種類</td>
          <td>
            <input type="radio" name="type" value="product"> 商品について　
            <input type="radio" name="type" value="staff"> 従業員について
          </td>
        </tr>
        <tr>
          <td>お問い合わせ内容</td>
          <td>
            <textarea cols="30" rows="5">詳細を入力してください</textarea>
          </td>
        </tr>
      </table>

      <div class="button-area">
        <input type="submit" value="送信">
      </div>
    </form>
  </div>

  <div class="footer"></div>

</body>
</html>
